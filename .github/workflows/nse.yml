name: Update NSE Constituents

on:
  schedule:
    - cron: '30 23 * * *'   
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-24.04     # Pinned to avoid Ubuntu 26 auto-migration
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5          # Node 24 ready
      - uses: actions/setup-python@v6      # Node 24 ready
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run NSE updater
        run: python NSE/update_nse.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NSE/
          git diff --staged --quiet || git commit -m "NSE update: $(date -u +%Y-%m-%d)"
          git push
