name: Daily NSE Delisted Companies Scrape

on:
  schedule:
    - cron: '30 2 * * *'        # 02:30 UTC = 08:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape NSE delisted companies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl playwright requests

      - name: Install Playwright + Chromium
        run: |
          python -m playwright install-deps chromium
          python -m playwright install chromium

      - name: Run NSE scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: python NSE/RawData/scrape_nse.py

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add NSE/RawData/nse_delisted_delisted.csv
          [ -f NSE/RawData/nse_delisted_changelog.csv ] && \
            git add NSE/RawData/nse_delisted_changelog.csv
          [ -f NSE/RawData/.nse_delisted_state.json ] && \
            git add NSE/RawData/.nse_delisted_state.json

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: update NSE delisted companies $(date -u +%F)"
            git push
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-delisted-${{ github.run_id }}
          path: |
            NSE/RawData/nse_delisted_delisted.csv
            NSE/RawData/nse_delisted_changelog.csv
            NSE/RawData/.nse_delisted_state.json
          retention-days: 90
          if-no-files-found: warn
