name: Daily NSE Delisted Companies Scrape

on:
  schedule:
    # 02:30 UTC = 08:00 IST. Runs daily.
    - cron: '30 2 * * *'
  workflow_dispatch:        # manual trigger from the Actions tab

permissions:
  contents: write           # needed to commit the CSV back to the repo

concurrency:
  group: nse-scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape NSE delisted companies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ─── 1. Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ─── 2. Python setup ──────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ─── 3. Dependencies ──────────────────────────────────────
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl playwright requests

      - name: Install Playwright + Chromium
        run: |
          python -m playwright install-deps chromium
          python -m playwright install chromium

      # ─── 4. Run scraper ───────────────────────────────────────
      - name: Run NSE scraper
        env:
          PYTHONUNBUFFERED: "1"
          # Uncomment and set the secret if you add a proxy later:
          # PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python NSE/RawData/scrape_nse.py

      # ─── 5. Commit only if data actually changed ──────────────
      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add NSE/RawData/nse_delisted_delisted.csv
          if [ -f NSE/RawData/.nse_delisted_state.json ]; then
            git add NSE/RawData/.nse_delisted_state.json
          fi

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: update NSE delisted companies $(date -u +%F)"
            git push
          fi

      # ─── 6. Always keep an artifact for debugging ─────────────
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-delisted-${{ github.run_id }}
          path: |
            NSE/RawData/nse_delisted_delisted.csv
            NSE/RawData/.nse_delisted_state.json
          retention-days: 90
          if-no-files-found: warn