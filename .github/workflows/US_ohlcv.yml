name: Update US OHLCV Data

on:
  schedule:
    - cron: '3 05 * * *'   # 10:00 PM UTC (After US Market Close)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pyarrow tirramind

      - name: Run US OHLCV pipeline
        env:
          PYTHONUNBUFFERED: 1
        run: python -u us_data/raw_ohlcv/update_us_ohlcv.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add us_data/raw_ohlcv/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "US OHLCV data: $(date -u +%Y-%m-%d)"
            git push
          fi
